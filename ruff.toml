target-version = "py312"
line-length = 88

[lint]
select = [
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "PGH",  # pygrep-hooks
    "RUF",  # ruff specific rules
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[lint.per-file-ignores]
"tests/*" = ["D103"]

[lint.pydocstyle]
convention = "pep257"

